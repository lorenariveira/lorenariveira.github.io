<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tarjetas: POR y PARA — Práctica</title>

<link rel="stylesheet" href="../assets/css/style.css">

<style>
  /* Estilos propios de esta actividad, con los colores del sitio. Los nombres de
     clase y las reglas son los del archivo original; lo que cambia son los
     valores de las variables y las medidas, que pasan a rem. */
  :root {
    /* Los dos colores que distinguen las respuestas. El terracota es el del
       sitio; el verde es la salvia oscurecida, porque la salvia tal cual no
       sostiene texto blanco a 14 px. */
    --por:  #9c4a2b;
    --para: #616b58;
  }

  /* El titular va más pequeño que en el resto del sitio: aquí la tarjeta es lo
     que importa, y con el tamaño de serie le quitaba peso. Se ajusta solo en
     esta página, no en `style.css`, que es de las diez. */
  .portada--simple h1 { font-size: min(6.2cqi, 2.3rem); }

  .mazo { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }

  .stage {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    width: 100%;
    max-width: 44rem;
    justify-content: center;
  }

  .nav-btn {
    background: #fff;
    border: 1px solid var(--borde);
    color: var(--tinta);
    width: 2.9rem;
    height: 2.9rem;
    border-radius: 50%;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: var(--sombra);
    user-select: none;
    transition: opacity .15s ease, border-color .15s ease;
  }
  .nav-btn:hover:not(:disabled) { border-color: #cdbaa6; }
  .nav-btn:disabled { opacity: .25; cursor: default; }

  /* El envoltorio de la tarjeta es un <button> para que se pueda girar con el
     teclado; hay que quitarle los estilos de botón que trae el navegador. */
  .card-wrap {
    perspective: 1400px;
    width: 100%;
    max-width: 34rem;
    height: 23rem;
    cursor: pointer;
    touch-action: pan-y;
    display: block;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    text-align: inherit;
  }
  .card {
    /* Es un <span> dentro del botón, así que sin esto el alto y el ancho no le
       aplican y las dos caras se quedan sin sitio donde colocarse. */
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .5s;
    transform-style: preserve-3d;
  }
  .card-wrap.flipped .card { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: var(--radio);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.9rem 2rem;
    backface-visibility: hidden;
    box-shadow: var(--sombra);
  }
  .front {
    background: #fff;
    border: 1px solid var(--borde);
  }
  .front .sentence {
    font-family: var(--display);
    font-size: 1.5rem;
    line-height: 1.55;
  }
  .front .blank {
    display: inline-block;
    min-width: 4rem;
    border-bottom: 2px dashed var(--tinta-suave);
  }
  .front .hint {
    margin-top: 1.25rem;
    font-size: .7rem;
    color: var(--tinta-suave);
    text-transform: uppercase;
    letter-spacing: .1em;
  }
  .back {
    transform: rotateY(180deg);
    color: #fff;
  }
  .back.por  { background: var(--por); }
  .back.para { background: var(--para); }
  .back .answer {
    font-family: var(--display);
    font-size: 2.9rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: .75rem;
  }
  .back .use {
    font-size: 1rem;
    opacity: .92;
    font-weight: 600;
  }
  .back .full-sentence {
    margin-top: 1.1rem;
    font-size: .9rem;
    opacity: .88;
    font-style: italic;
    line-height: 1.5;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: .9rem;
    font-size: .85rem;
    color: var(--tinta-suave);
  }
  .dots { display: flex; gap: .45rem; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--borde);
    transition: background .2s ease;
  }
  .dot.active { background: var(--terracota); }

  .nota { font-size: .85rem; color: var(--tinta-suave); text-align: center; }

  /* Para anunciar a un lector de pantalla lo que el resto ve al girar la tarjeta. */
  .solo-lectores {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  @media (max-width: 30rem) {
    .card-wrap { height: 19.5rem; }
    .front .sentence { font-size: 1.12rem; }
    .face { padding: 1.5rem 1.25rem; }
    .stage { gap: .6rem; }
    .nav-btn { width: 2.5rem; height: 2.5rem; font-size: 1.1rem; }
  }
</style>
</head>
<body>

<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <div class="contenedor cabecera__inner">
    <a class="marca" href="index.html">Práctica<span>Lorena Riveira</span></a>
    <nav class="nav" aria-label="Navegación">
      <a href="index.html">Todas las actividades</a>
    </nav>
  </div>
</header>

<main id="contenido">

  <section class="portada portada--simple">
    <div class="contenedor">
      <div class="portada__texto">
        <h1>Tarjetas: POR y PARA</h1>
        <p class="portada__entradilla">Toca la tarjeta para ver la respuesta · usa las flechas para avanzar</p>
      </div>
    </div>
  </section>

  <section class="seccion seccion--alt">
    <div class="contenedor">
      <div class="mazo">

        <div class="stage">
          <button class="nav-btn" id="prevBtn" type="button" aria-label="Anterior">&#8592;</button>
          <button class="card-wrap" id="cardWrap" type="button" aria-expanded="false">
            <span class="card">
              <span class="face front" id="frontFace">
                <span class="sentence" id="sentenceText"></span>
                <span class="hint">Clic para ver la respuesta</span>
              </span>
              <span class="face back" id="backFace" aria-hidden="true">
                <span class="answer" id="answerText"></span>
                <span class="use" id="useText"></span>
                <span class="full-sentence" id="fullSentenceText"></span>
              </span>
            </span>
          </button>
          <button class="nav-btn" id="nextBtn" type="button" aria-label="Siguiente">&#8594;</button>
        </div>

        <p class="progress">
          <span id="counter">1 / 10</span>
          <span class="dots" id="dots" aria-hidden="true"></span>
        </p>

        <p class="nota">Ejercicio basado en el cuadro comparativo POR / PARA</p>

        <p class="solo-lectores" id="aviso" aria-live="polite"></p>

      </div>
    </div>
  </section>

</main>

<footer class="pie">
  <div class="contenedor pie__inner">
    <div><p>© 2020–2026 Lorena Riveira</p></div>
  </div>
</footer>

<script>
const cards = [
  { before: "No pudimos salir a caminar", after: "la lluvia.", answer: "por", use: "Causa o motivo" },
  { before: "Te llamo", after: "la mañana, cuando tenga un momento libre.", answer: "por", use: "Tiempo aproximado" },
  { before: "Este cuchillo sirve", after: "cortar pan.", answer: "para", use: "Finalidad o propósito" },
  { before: "Compré estas flores", after: "mi abuela.", answer: "para", use: "Destinatario" },
  { before: "", after: "mí, esta es la mejor película del año.", answer: "para", use: "Opinión" },
  { before: "Salimos", after: "el aeropuerto en media hora.", answer: "para", use: "Dirección a un destino" },
  { before: "El informe tiene que estar listo", after: "el viernes.", answer: "para", use: "Fecha límite" },
  { before: "Se cancelaron las clases", after: "la huelga de transporte.", answer: "por", use: "Causa o motivo" },
  { before: "Ayer vi a Juan corriendo", after: "la plaza.", answer: "por", use: "Lugar aproximado" },
  { before: "Este regalo es", after: "ti.", answer: "para", use: "Destinatario" },
];

let index = 0;
let flipped = false;

const cardWrap = document.getElementById('cardWrap');
const sentenceText = document.getElementById('sentenceText');
const answerText = document.getElementById('answerText');
const useText = document.getElementById('useText');
const fullSentenceText = document.getElementById('fullSentenceText');
const frontFace = document.getElementById('frontFace');
const backFace = document.getElementById('backFace');
const counter = document.getElementById('counter');
const dotsWrap = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const aviso = document.getElementById('aviso');

function buildDots(){
  dotsWrap.innerHTML = '';
  cards.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === index ? ' active' : '');
    dotsWrap.appendChild(d);
  });
}

function frasePlana(c){
  return `${c.before} ${c.answer.toUpperCase()} ${c.after}`.replace(/\s+/g,' ').trim();
}

/* La cara de atrás sigue en el HTML aunque no se vea, así que se oculta con
   aria-hidden mientras la tarjeta no está girada: si no, un lector de pantalla
   canta la respuesta antes de que el estudiante la piense. */
function girar(estado){
  flipped = estado;
  cardWrap.classList.toggle('flipped', flipped);
  cardWrap.setAttribute('aria-expanded', String(flipped));
  frontFace.setAttribute('aria-hidden', String(flipped));
  backFace.setAttribute('aria-hidden', String(!flipped));
  const c = cards[index];
  aviso.textContent = flipped ? `${c.answer.toUpperCase()}. ${c.use}. ${frasePlana(c)}` : '';
}

function render(){
  const c = cards[index];
  sentenceText.innerHTML = `${c.before} <span class="blank">&nbsp;</span> ${c.after}`;
  answerText.textContent = c.answer.toUpperCase();
  useText.textContent = c.use;
  fullSentenceText.textContent = frasePlana(c);
  backFace.className = 'face back ' + c.answer;
  counter.textContent = `${index + 1} / ${cards.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === cards.length - 1;
  buildDots();
}

function goTo(i){
  if (i < 0 || i >= cards.length) return;
  index = i;
  render();
  girar(false);
  aviso.textContent = `Tarjeta ${index + 1} de ${cards.length}. ${cards[index].before} … ${cards[index].after}`;
}

cardWrap.addEventListener('click', () => girar(!flipped));

prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goTo(index - 1); });
nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goTo(index + 1); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(index + 1);
  if (e.key === 'ArrowLeft') goTo(index - 1);
});

// Swipe support
let touchStartX = null;
cardWrap.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].clientX;
});
cardWrap.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  /* Un toque no se trata aquí: el navegador dispara «click» justo después y de
     eso se encarga el otro manejador. Si se girase también desde aquí, la
     tarjeta daría dos vueltas seguidas y se quedaría como estaba. */
  if (Math.abs(dx) > 50) {
    e.preventDefault();
    goTo(dx < 0 ? index + 1 : index - 1);
  }
  touchStartX = null;
});

render();
</script>
</body>
</html>
